
<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Employee Registration Form</h2>

    <form id="employeeForm"  enctype="multipart/form-data">


        <label>Employee Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email" required>

        <label>Address</label>
        <textarea id="address" placeholder="Enter address" required></textarea>

        <label>Gender</label>
        <div class="gender">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>

        <label>Qualification</label>
        <select id="qualification" required>
            <option value="">Select Qualification</option>
            <option>10th</option>
            <option>12th</option>
            <option>Diploma</option>
            <option>Degree</option>
            <option>Master Degree</option>
        </select>

        <label>Languages</label>
        <div class="language-box">
            <div id="selectedLanguages" class="selected">
                Select Languages
            </div>

            <div id="options" class="options">
                <label><input type="checkbox" value="Tamil"> Tamil</label>
                <label><input type="checkbox" value="English"> English</label>
                <label><input type="checkbox" value="Hindi"> Hindi</label>
                <label><input type="checkbox" value="Bengali"> Bengali</label>
                <label><input type="checkbox" value="Telugu"> Telugu</label>
                <label><input type="checkbox" value="Malayalam"> Malayalam</label>
            </div>
        </div>

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter phone number"
               pattern="[0-9]{10}" required>

        <label>Upload Resume (PDF, Max 5MB)</label>
        <input type="file" id="resume" accept=".pdf" required>

        <button type="submit">Submit</button>


    </form>
</div>

<script src="script.js"></script>
</body>
</html>
